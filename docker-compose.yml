# superproductivity-sync-mcp behind a reverse proxy.
#
# The `sync-mcp` service is NOT published on a host port on purpose: your
# reverse proxy (Traefik, Caddy, nginx, ...) terminates TLS and forwards
# to sync-mcp:8000 on the shared `proxy` network. See README.md for examples.
services:
  sync-mcp:
    # Published by .github/workflows/ci.yml. Override the tag with IMAGE_TAG
    # (e.g. a release `v0.1.0` or `sha-<commit>`). Private packages need
    # `docker login ghcr.io` first. To build locally instead: `docker compose build`.
    image: ghcr.io/samuelb/superproductivity-sync-mcp:${IMAGE_TAG:-main}
    build: .
    restart: unless-stopped
    env_file: .env
    volumes:
      - sync-mcp-data:/data
    networks:
      - proxy
    # --- Traefik example (uncomment and adapt) ---------------------------
    # labels:
    #   traefik.enable: "true"
    #   traefik.http.routers.sync-mcp.rule: "Host(`mcp.example.com`)"
    #   traefik.http.routers.sync-mcp.entrypoints: "websecure"
    #   traefik.http.routers.sync-mcp.tls.certresolver: "letsencrypt"
    #   traefik.http.services.sync-mcp.loadbalancer.server.port: "8000"

  # --- Optional bundled Caddy reverse proxy (profile: caddy) --------------
  # docker compose --profile caddy up -d
  caddy:
    image: caddy:2
    profiles: ["caddy"]
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      MCP_PUBLIC_HOST: ${MCP_PUBLIC_HOST:-mcp.example.com}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - proxy

volumes:
  sync-mcp-data:
  caddy-data:
  caddy-config:

networks:
  proxy:
    # Set `external: true` if your proxy already owns this network.
