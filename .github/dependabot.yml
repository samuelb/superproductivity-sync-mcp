# Keeps actions, the Python base image, the compose images and the uv lockfile current.
# Every update lands as a PR that runs the CI test job before merge.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    assignees:
      - samuelb
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci"

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
    assignees:
      - samuelb
    groups:
      docker-minor-patch:
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "build"

  # The optional Caddy proxy in docker-compose.yml. Our own image is selected by
  # IMAGE_TAG and must not be bumped here.
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
      day: monday
    ignore:
      - dependency-name: ghcr.io/samuelb/superproductivity-sync-mcp
    commit-message:
      prefix: "build"

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
      day: monday
    assignees:
      - samuelb
    groups:
      python-minor-and-patch:
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "build"
