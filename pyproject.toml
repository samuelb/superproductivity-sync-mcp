[project]
name = "superproductivity-sync-mcp"
version = "0.1.0"
description = "MCP server for Super Productivity: reads and updates the Nextcloud sync file (sync-data.json) as a peer sync client."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
  "mcp>=2.1,<3",
  "httpx>=0.28",
  "uvicorn>=0.52",
  "starlette>=1.6",
  "pydantic>=2.13",
  "pydantic-settings>=2.15",
  "argon2-cffi>=25.1",
  "cryptography>=50",
]

[project.scripts]
superproductivity-sync-mcp = "superproductivity_sync_mcp.__main__:main"

[project.optional-dependencies]
dev = [
  "pytest>=9.1",
  "pytest-asyncio>=1.4",
  "ruff>=0.16",
]

[build-system]
requires = ["hatchling>=1.32"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/superproductivity_sync_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
