[project]
name = "spmcp"
version = "0.1.0"
description = "MCP server for Super Productivity: reads and updates the Nextcloud sync file (sync-data.json) as a peer sync client."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
  "mcp>=2.1,<3",
  "httpx>=0.28",
  "uvicorn>=0.34",
  "starlette>=0.46",
  "pydantic>=2.10",
  "pydantic-settings>=2.8",
  "argon2-cffi>=23.1",
  "cryptography>=44",
]

[project.scripts]
spmcp = "spmcp.__main__:main"

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.25",
  "ruff>=0.9",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/spmcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
